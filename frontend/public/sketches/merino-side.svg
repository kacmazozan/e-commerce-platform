  <path d="M112 97 Q120 101 134 97" fill="none" stroke="#4a3d6e" stroke-width="0.8"/>
  <path d="M111 101 Q120 105 135 101" fill="none" stroke="#4a3d6e" stroke-width="0.8"/>

