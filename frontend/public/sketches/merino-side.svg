  <line x1="148" y1="182" x2="156" y2="182" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="148" y1="197" x2="157" y2="197" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="148" y1="212" x2="157" y2="212" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="151" cy="233" rx="7" ry="10" fill="#e8d5c0" stroke="#2d2826" stroke-width="1.2"/>

  <!-- Trousers (side view) -->
  <!-- Front leg (visible) -->
  <path d="M104 258 L108 344 L126 344 L122 302 L138 302 L134 344 L138 258 Z" fill="#1c1b26" stroke="#2d2826" stroke-width="1.3"/>
