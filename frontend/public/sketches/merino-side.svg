  <line x1="101" y1="175" x2="143" y2="175" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="101" y1="190" x2="143" y2="190" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="101" y1="205" x2="143" y2="205" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="102" y1="220" x2="143" y2="220" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="102" y1="235" x2="142" y2="235" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="103" y1="250" x2="141" y2="250" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>

