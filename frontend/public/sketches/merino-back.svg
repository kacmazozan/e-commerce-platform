  <path d="M103 90 Q120 95 137 90" fill="none" stroke="#4a3d6e" stroke-width="0.7"/>
  <path d="M102 94 Q120 99 138 94" fill="none" stroke="#4a3d6e" stroke-width="0.7"/>

