  <line x1="166" y1="182" x2="176" y2="182" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="167" y1="197" x2="177" y2="197" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
