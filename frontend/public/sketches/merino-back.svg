  <path d="M100 62 Q106 74 110 80" fill="none" stroke="#2e221a" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 62 Q134 74 130 80" fill="none" stroke="#2e221a" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 68 Q120 76 130 68" fill="none" stroke="#2e221a" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck (back) -->
