  <line x1="78" y1="158" x2="162" y2="158" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="173" x2="162" y2="173" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="188" x2="162" y2="188" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="203" x2="162" y2="203" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="218" x2="162" y2="218" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="79" y1="233" x2="161" y2="233" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="80" y1="248" x2="160" y2="248" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>

