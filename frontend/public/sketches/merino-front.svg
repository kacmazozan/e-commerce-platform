  <line x1="120" y1="256" x2="120" y2="300" stroke="#2d2826" stroke-width="0.7"/>

  <!-- Left shoe -->
  <path d="M88 344 Q86 356 85 362 Q90 367 101 366 Q106 363 107 356 L109 344" fill="#19181f" stroke="#2d2826" stroke-width="1.1"/>

  <!-- Right shoe -->
  <path d="M131 344 L133 356 Q134 363 139 366 Q150 367 155 362 Q154 356 152 344" fill="#19181f" stroke="#2d2826" stroke-width="1.1"/>

</svg>
