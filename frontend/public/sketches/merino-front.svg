<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380">
  <!-- Background -->
  <rect width="240" height="380" fill="#f7f5f2"/>

  <!-- Hair -->
  <path d="M100 32 Q102 16 120 14 Q138 16 140 32 Q142 20 140 14" fill="#2e221a" stroke="#2e221a" stroke-width="1"/>

  <!-- Head -->
  <ellipse cx="120" cy="44" rx="21" ry="26" fill="#e8d5c0" stroke="#2d2826" stroke-width="1.5"/>

  <!-- Ear hints -->
  <path d="M99 46 Q96 50 99 54" fill="none" stroke="#c4a98a" stroke-width="1.2"/>
  <path d="M141 46 Q144 50 141 54" fill="none" stroke="#c4a98a" stroke-width="1.2"/>

  <!-- Neck -->
  <rect x="113" y="69" width="14" height="16" fill="#e8d5c0"/>

  <!-- Turtleneck collar — upper folded band -->
  <path d="M103 83 Q120 91 137 83 L139 97 Q120 106 101 97 Z" fill="#6b5c9e" stroke="#2d2826" stroke-width="1.2"/>
  <!-- Collar rib lines -->
  <path d="M104 86 Q120 93 136 86" fill="none" stroke="#4a3d6e" stroke-width="0.7"/>
  <path d="M103 90 Q120 97 137 90" fill="none" stroke="#4a3d6e" stroke-width="0.7"/>
  <path d="M102 94 Q120 101 138 94" fill="none" stroke="#4a3d6e" stroke-width="0.7"/>

  <!-- Sweater body -->
  <path d="M84 118 Q79 158 78 198 Q77 228 81 256 L159 256 Q163 228 162 198 Q161 158 156 118 L139 97 Q120 106 101 97 Z" fill="#6b5c9e" stroke="#2d2826" stroke-width="1.6"/>

  <!-- Body rib lines -->
  <line x1="80" y1="128" x2="160" y2="128" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="79" y1="143" x2="161" y2="143" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="158" x2="162" y2="158" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="173" x2="162" y2="173" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="188" x2="162" y2="188" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="203" x2="162" y2="203" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="78" y1="218" x2="162" y2="218" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="79" y1="233" x2="161" y2="233" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>
  <line x1="80" y1="248" x2="160" y2="248" stroke="#4a3d6e" stroke-width="0.6" opacity="0.6"/>

  <!-- Left sleeve -->
  <path d="M84 118 Q70 142 64 172 Q59 198 63 228 L74 226 Q71 200 76 176 Q83 150 96 128" fill="#6b5c9e" stroke="#2d2826" stroke-width="1.3"/>
  <!-- Sleeve rib lines -->
  <line x1="64" y1="182" x2="74" y2="182" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="63" y1="197" x2="73" y2="197" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="63" y1="212" x2="73" y2="212" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <!-- Left hand -->
  <ellipse cx="68" cy="233" rx="7" ry="10" fill="#e8d5c0" stroke="#2d2826" stroke-width="1.2"/>

  <!-- Right sleeve -->
  <path d="M156 118 Q170 142 176 172 Q181 198 177 228 L166 226 Q169 200 164 176 Q157 150 144 128" fill="#6b5c9e" stroke="#2d2826" stroke-width="1.3"/>
  <line x1="166" y1="182" x2="176" y2="182" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="167" y1="197" x2="177" y2="197" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <line x1="167" y1="212" x2="177" y2="212" stroke="#4a3d6e" stroke-width="0.5" opacity="0.6"/>
  <!-- Right hand -->
  <ellipse cx="172" cy="233" rx="7" ry="10" fill="#e8d5c0" stroke="#2d2826" stroke-width="1.2"/>

  <!-- Trousers (slim, dark) -->
