services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommerce
      JWT_SECRET: dev-secret-change-in-production
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      MIGRATION_CHECK_ORDER: ${MIGRATION_CHECK_ORDER:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-100kb}
      SENSITIVE_RATE_LIMIT_WINDOW_MS: ${SENSITIVE_RATE_LIMIT_WINDOW_MS:-900000}
      SENSITIVE_RATE_LIMIT_MAX: ${SENSITIVE_RATE_LIMIT_MAX:-20}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-invoices@fier.com}
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123456
      SALES_MANAGER_EMAIL: salesmanager@example.com
      SALES_MANAGER_PASSWORD: salesmanager123456
      SALES_MANAGER_NAME: Jane Smith
      PRODUCT_MANAGER_EMAIL: productmanager@example.com
      PRODUCT_MANAGER_PASSWORD: productmanager123456
      PRODUCT_MANAGER_NAME: John Doe
    depends_on:
      - db
      - mailserver
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
  mailserver:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web interface port

volumes:
  postgres_data:
